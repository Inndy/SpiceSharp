name: Windows release build

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build win-${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Set up POSIX build utilities
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils curl tar xz mingw-w64-ucrt-x86_64-nasm

      - name: Set up pinned Clang cross-toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $release = '20261020'
          $name = "llvm-mingw-$release-ucrt-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$name.zip" -OutFile $zip
          $expected = 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd'
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -cne $expected) {
            throw 'llvm-mingw toolchain checksum mismatch'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          "LLVM_MINGW_BIN=$env:RUNNER_TEMP/$name/bin" >> $env:GITHUB_ENV

      - name: Fetch pinned FFmpeg source archive
        run: |
          $ErrorActionPreference = 'Stop'
          # Upstream reset TLS on both hosted targets. A source cache is allowed
          # only for the exact same archive hash; fetch.sh checks it again.
          $pin = Get-Content native/fetch.sh | Select-String '^fetch (ffmpeg-\S+) ([a-f0-9]{64}) (https://\S+)$'
          if (@($pin).Count -ne 1) { throw 'Expected exactly one pinned FFmpeg release' }
          $url = $pin.Matches[0].Groups[3].Value
          $expected = $pin.Matches[0].Groups[2].Value
          New-Item -ItemType Directory -Force native/downloads | Out-Null
          $name = [IO.Path]::GetFileName(([uri]$url).AbsolutePath)
          $archive = Join-Path native/downloads $name
          $downloaded = $false
          foreach ($source in @($url, "https://distfiles.alpinelinux.org/distfiles/edge/$name")) {
            try {
              Invoke-WebRequest $source -OutFile $archive -TimeoutSec 30
            } catch {
              Write-Warning "Could not download $source; trying the next pinned source."
              continue
            }
            if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -cne $expected) {
              throw 'FFmpeg archive checksum mismatch'
            }
            $downloaded = $true
            break
          }
          if (-not $downloaded) { throw 'All pinned FFmpeg source downloads failed' }

      - name: Build native codecs
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:LLVM_MINGW_BIN;$env:MSYS2_ROOT/ucrt64/bin;$env:MSYS2_ROOT/usr/bin;$env:PATH"
          & "$env:MSYS2_ROOT/usr/bin/bash.exe" native/build.sh $env:TARGET_ARCH
          if ($LASTEXITCODE -ne 0) { throw 'Native codec build failed' }

      - name: Verify native ABI and hardening
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $env:PATH = "$env:LLVM_MINGW_BIN;$env:PATH"
          python native/verify.py $env:TARGET_ARCH
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed' }

      # Native codecs use Clang. Native AOT still needs the MSVC linker/Windows SDK.
      - name: Set up Native AOT linker environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Build solution and run window-free tests
        if: matrix.arch == 'x64'
        run: |
          function Test-OnlyDisturbedAllocationWindows([string]$TrxPath) {
            if (-not (Test-Path -LiteralPath $TrxPath)) { return $false }
            try { [xml]$results = Get-Content -LiteralPath $TrxPath -Raw } catch { return $false }
            if ($results.TestRun.ResultSummary.outcome -ne 'Failed') { return $false }
            $counts = $results.TestRun.ResultSummary.Counters
            if (-not $counts -or [int]$counts.total -le 0 -or $counts.executed -ne $counts.total) { return $false }
            $failed = @($results.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed')
            if ($failed.Count -eq 0) { return $false }
            $otherFailures = @($failed | Where-Object {
              [string]$_.Output.ErrorInfo.Message -notmatch '(?s)^.+: no undisturbed allocation window: all [0-9]+ attempts were disturbed.*This is runtime interference, not a clean-window allocation regression\.$'
            })
            return $otherFailures.Count -eq 0
          }
          # vcvars sets Platform=x64: override it so this managed build keeps the Clang DLLs.
          dotnet build SpiceViewer.sln -c Release '-p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { throw 'Solution build failed' }
          $projects = @(
            'Spice.Native.Tests', 'Spice.Wire.Tests', 'Spice.Replay.Tests',
            'Spice.Video.Tests', 'Spice.Diagnostics.Tests', 'Pve.Api.Tests', 'Pve.Term.Tests'
          )
          New-Item -ItemType Directory -Force TestResults | Out-Null
          '<RunSettings><xUnit><ParallelizeTestCollections>false</ParallelizeTestCollections><MaxParallelThreads>1</MaxParallelThreads></xUnit></RunSettings>' | Set-Content TestResults/serial.runsettings
          foreach ($project in $projects) {
            $testArgs = @('test', "tests/$project/$project.csproj", '-c', 'Release', '--no-build', '--no-restore', '-p:Platform=AnyCPU', '--logger', "trx;LogFileName=$project.trx", '--results-directory', 'TestResults')
            if ($project -like 'Spice.*') { $testArgs += @('--settings', 'TestResults/serial.runsettings') }
            dotnet @testArgs
            if ($LASTEXITCODE -ne 0 -and (Test-OnlyDisturbedAllocationWindows "TestResults/$project.trx")) {
              # One plain fresh-process rerun, only for exhausted GC-disturbance guards.
              # Preserve the first result; actual clean-window allocation regressions never retry.
              Move-Item -LiteralPath "TestResults/$project.trx" -Destination "TestResults/$project.gc-disturbed.trx"
              Write-Warning "Only GC-disturbed measurement windows in $project; rerunning the project once."
              dotnet @testArgs
            }
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $project" }
          }

      - name: Publish Native AOT portable package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./tools/package.ps1 -Rid "win-$env:TARGET_ARCH"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }

      - name: Validate release archive and checksum
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem "artifacts/SpiceViewer-*-win-$env:TARGET_ARCH.zip")
          if ($packages.Count -ne 1) { throw 'Expected exactly one release archive' }
          $package = $packages[0]
          $hash = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLowerInvariant()
          $expected = "$hash  $($package.Name)"
          if ((Get-Content -Raw "$($package.FullName).sha256").Trim() -cne $expected) {
            throw 'Release archive checksum does not match its sidecar'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @(
              'SpiceViewer.exe', 'PveTerm.exe', 'PveLauncher/PveLauncher.exe',
              'spicecodec.dll', 'turbojpeg.dll', 'opus.dll', 'README.txt', 'LICENSE.txt',
              'source/native/build.sh', 'source/native/build-msvc.sh', 'source/native/fetch.sh'
            )) {
              if ($entries -cnotcontains $required) { throw "Release archive is missing $required" }
            }
            if ($entries | Where-Object { $_ -match '(^|/)data/|\.vv$|\.pdb$' }) {
              throw 'Release archive contains runtime data, a connection file or debug symbols'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload portable release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SpiceViewer-win-${{ matrix.arch }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test results
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-win-x64
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
