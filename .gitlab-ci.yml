# Requires a pre-provisioned Windows x64 runner. See docs/ci.md.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - verify

windows-x64:
  stage: verify
  tags:
    - windows
    - x64
    - spice-build
  timeout: 1h
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_NOLOGO: '1'
    NUGET_PACKAGES: '$CI_PROJECT_DIR/.nuget/packages'
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if (-not $env:SPICE_MSYS2_ROOT) { throw 'Set SPICE_MSYS2_ROOT on the runner; see docs/ci.md' }
      $msysRoot = (Resolve-Path -LiteralPath $env:SPICE_MSYS2_ROOT).Path
      $bash = Join-Path $msysRoot 'usr/bin/bash.exe'
      $env:PATH = "$(Join-Path $msysRoot 'clang64/bin');$(Join-Path $msysRoot 'usr/bin');$env:PATH"
      & $bash native/build.sh x64
      if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      python native/verify.py x64
      if ($LASTEXITCODE -ne 0) { throw 'Native DLL verification failed' }
      dotnet build SpiceViewer.sln -c Release '-p:Platform=Any CPU'
      if ($LASTEXITCODE -ne 0) { throw 'Solution build failed' }
      $projects = @(
        'Spice.Native.Tests', 'Spice.Wire.Tests', 'Spice.Replay.Tests',
        'Spice.Video.Tests', 'Spice.Diagnostics.Tests', 'Pve.Api.Tests', 'Pve.Term.Tests'
      )
      foreach ($project in $projects) {
        dotnet test "tests/$project/$project.csproj" -c Release --no-build --no-restore -p:Platform=AnyCPU --logger "trx;LogFileName=$project.trx" --results-directory "$env:CI_PROJECT_DIR/test-results"
        if ($LASTEXITCODE -ne 0) { throw "Tests failed: $project" }
      }
      pwsh -NoProfile -File tools/package.ps1 -Rid win-x64
      if ($LASTEXITCODE -ne 0) { throw 'Native AOT packaging failed' }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/*.trx
      - artifacts/*.zip
      - artifacts/*.zip.sha256
